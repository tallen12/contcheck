# Rule-based generation settings for `contcheck corrupt` (see corrupt/config.py).
seed: 13
variants_per_paragraph: 2
# Relative weight of the number of errors per paragraph; 0 leaves it clean.
errors_per_paragraph: {0: 0.15, 1: 0.40, 2: 0.30, 3: 0.15}
# Share of paragraphs with 2+ errors that get them on neighbouring words.
adjacent_share: 0.1
# Share of RealWord edits from the masked-LM word-choice corruptor (the rest use the
# confusion sets); 0 skips loading the masked LM.
word_choice_share: 0.5
# roberta-large judges fit better than distilroberta-base (more clear errors, fewer
# acceptable alternatives) at about 2.5x the cost; see the implementation plan, Phase 1b.
word_choice_model: roberta-large
# Relative weight per kind; kinds without a corruptor are skipped.
kind_weights:
  Spelling: 1  # non-words are the SymSpell pre-pass's; kept as input noise
  RealWord: 2
  VerbTense: 2
  SubjectVerbAgreement: 2
  Determiner: 2
  Preposition: 1.5
  Punctuation: 1.5
  default: 1

[project]
name = "contcheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tyler Allen", email = "tallen12@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=5.3.0",
    "datasets>=5.1.0",
    "lemminflect>=0.2.3",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
    "symspellpy>=6.10.0",
]

[project.scripts]
contcheck = "contcheck:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "en-core-web-sm",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["design-docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "RUF", "PTH"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["contcheck"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
# preshed 3.0.14 (2026-10-24) breaks spaCy model loading on Python 3.14 with an
# OverflowError in Tokenizer._flush_specials; 3.0.13 works.
constraint-dependencies = ["preshed!=3.0.14"]
